name: Compile iOS (fork only)

# Compiles the iOS targets, Swift bridge included, because the pinned Swift package does not build
# on the newest Xcode. Runs only when this branch is pushed.
on:
  push:
    branches: [ci/ios-compile]

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: "26.3"
          - os: macos-15
            xcode: "26.0"
          - os: macos-15
            xcode: "16.3"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Report the active toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Compile the iOS targets
        run: ./gradlew :library:compileKotlinIosSimulatorArm64 :library:compileKotlinIosArm64 --stacktrace
