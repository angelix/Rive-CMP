name: Build native desktop runtime

# Deliberately NOT run on every push/PR: this builds Skia and the Rive C++ runtime
# from source and takes a long time, while the output only changes when the JNI
# bridge or the pinned rive-runtime commit changes.
on:
  workflow_dispatch:
    inputs:
      upload_only:
        description: "Build and upload the artifacts without failing on checksum drift"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  schedule:
    # Monthly drift check: does the pinned commit still build and pass the smoke test?
    - cron: "0 4 1 * *"

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 runners are arm64 and ship an older Xcode/SDK. The Skia checkout
          # pinned by rive-runtime vendors a zlib whose `#define fdopen(fd,mode) NULL`
          # breaks against the macOS 15.5 SDK's own fdopen declaration, so the newer
          # image cannot build it. The x64 library is cross-compiled there for the same
          # reason, and tested under Rosetta.
          - { os: macos, arch: arm64, runner: macos-14, library: librive-desktoparm64.dylib, tested: true }
          - { os: macos, arch: x64, runner: macos-14, library: librive-desktopx64.dylib, tested: true }
          - { os: linux, arch: x64, runner: ubuntu-22.04, library: librive-desktopx64.so, tested: true }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm, library: librive-desktoparm64.so, tested: true }
          - { os: windows, arch: x64, runner: windows-2022, library: librive-desktopx64.dll, tested: true }
          # Cross-compiled on x64, where it cannot be loaded: the test-windows-arm64 job
          # below tests it on an arm64 runner.
          - { os: windows, arch: arm64, runner: windows-2022, library: librive-desktoparm64.dll, tested: false }

    defaults:
      run:
        shell: bash

    env:
      SKIA_DIR: submodules/rive-runtime/skia/dependencies/skia
      # Where Skia's build output lands, named the way CMakeLists.txt looks for it
      SKIA_OUT: ${{ matrix.os == 'macos' && 'macosx' || matrix.os }}/${{ matrix.arch }}
      COMMITTED_LIBRARY: runtime-${{ matrix.os }}-${{ matrix.arch }}/src/main/resources/${{ matrix.library }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record the pinned rive-runtime commit
        run: |
          git -C submodules/rive-runtime rev-parse HEAD | tee pinned-rive-runtime.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          # The x64 macOS library is tested by an x64 JVM running under Rosetta
          architecture: ${{ matrix.os == 'macos' && matrix.arch == 'x64' && 'x64' || '' }}

      - uses: actions/setup-python@v5
        if: matrix.os != 'macos'
        with:
          python-version: "3.11"

      - name: Report the active toolchain
        run: |
          if [ "${{ matrix.os }}" = "macos" ]; then
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            xcodebuild -version || true
            xcrun --show-sdk-version || true
          else
            clang --version || true
            python --version
          fi
          cmake --version

      - name: Install native build tools (macOS)
        if: matrix.os == 'macos'
        run: brew install ninja premake

      - name: Install native build tools (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          # uuid-dev is for Premake, which build_rive.sh builds from source. The rest of
          # the list after clang is what Skiko, not this library, needs to load in the tests.
          sudo apt-get install -y ninja-build clang uuid-dev libgl1 libegl1 libx11-6 libfontconfig1

      - name: Install native build tools (Windows)
        if: matrix.os == 'windows'
        run: |
          command -v ninja || choco install ninja --no-progress -y
          command -v make || choco install make --no-progress -y
          # The Rive renderer's shader build compiles HLSL with fxc, which the Windows
          # SDK installs but does not put on PATH
          FXC=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/fxc.exe | sort -V | tail -n 1)
          echo "fxc: $FXC"
          cygpath -w "$(dirname "$FXC")" >> "$GITHUB_PATH"

      - name: Restore a previous Skia build
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SKIA_DIR }}/include
            ${{ env.SKIA_DIR }}/out/${{ env.SKIA_OUT }}
          key: skia-1-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('native/rive-desktop/make_skia.sh') }}

      - name: Match the Skia flags the shipped binary was built with
        if: matrix.os == 'macos' && steps.skia-cache.outputs.cache-hit != 'true'
        working-directory: submodules/rive-runtime/skia/dependencies
        run: |
          # The pinned rive-runtime's make_skia_macos.sh adds three flags to
          # SHARED_EXTRA_CFLAGS that the working prebuilt dylib was never built
          # with (args.gn supplied in #160): -fembed-bitcode, -flto=full and
          # -DRIVE_OPTIMIZED. LTO in particular leaves LLVM bitcode in Skia's
          # archives while the bridge is compiled without it, which is the leading
          # suspect for the SkCanvas::save() segfault in the CI-built binary.
          # The script escapes its quotes (\"-flto=full\"), so the pattern must too.
          sed -i.bak -E '/\\"-fembed-bitcode\\"|\\"-flto=full\\"|\\"-DRIVE_OPTIMIZED\\"/d' make_skia_macos.sh
          if grep -qE '\\"-flto=full\\"' make_skia_macos.sh; then
            echo "::error::flag patch did not apply"; exit 1
          fi
          echo "--- SHARED_EXTRA_CFLAGS after patch ---"
          sed -n '/SHARED_EXTRA_CFLAGS=/,/^    "$/p' make_skia_macos.sh

      - name: Build Skia (macOS)
        if: matrix.os == 'macos' && steps.skia-cache.outputs.cache-hit != 'true'
        working-directory: submodules/rive-runtime/skia/dependencies
        run: |
          # make_skia_macos.sh finishes by uploading its build cache to Rive's own
          # S3 bucket (s3://2d-public/archives), which we have no credentials for.
          # That upload exits non-zero and would fail the step even though the
          # build succeeded, so ignore the script's status and assert on the
          # artifact CMakeLists.txt actually links against instead.
          ./make_skia_macos.sh ${{ matrix.arch }} || echo "make_skia_macos.sh exited non-zero (expected: S3 cache upload)"

      - name: Build Skia (Linux, Windows)
        if: matrix.os != 'macos' && steps.skia-cache.outputs.cache-hit != 'true'
        run: native/rive-desktop/make_skia.sh ${{ matrix.arch }}

      - name: Show the Skia build
        run: |
          ls -lh "$SKIA_DIR/out/$SKIA_OUT"/*skia.*
          echo "--- gn args actually used ---"
          cat "$SKIA_DIR/out/$SKIA_OUT/args.gn"

      - name: Configure
        run: |
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            macos-arm64) PLATFORM_ARGS=() ;;
            macos-x64) PLATFORM_ARGS=(-DCMAKE_OSX_ARCHITECTURES=x86_64) ;;
            linux-*) PLATFORM_ARGS=(-G Ninja -DCMAKE_CXX_COMPILER=clang++) ;;
            windows-x64) PLATFORM_ARGS=(-G Ninja -DCMAKE_CXX_COMPILER=clang++) ;;
            windows-arm64)
              PLATFORM_ARGS=(-G Ninja -DCMAKE_CXX_COMPILER=clang++
                -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64
                -DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc) ;;
          esac
          cmake -B native/rive-desktop/build -S native/rive-desktop -DCMAKE_BUILD_TYPE=Release "${PLATFORM_ARGS[@]}"

      - name: Locate the static libs Premake produced
        if: always()
        run: |
          # CMake links against native/rive-desktop/out/<arch>_<config>/. Show where
          # build_rive.sh actually wrote the libs so a path mismatch is diagnosable
          # from the log rather than by guesswork.
          find native/rive-desktop/out -maxdepth 2 \( -name '*.a' -o -name '*.lib' \) 2>/dev/null | head -40 || true
          echo "--- expected by CMake ---"
          ls -la native/rive-desktop/out/${{ matrix.arch }}_release/ 2>/dev/null || echo "(missing)"

      - name: Build
        run: cmake --build native/rive-desktop/build

      - name: Fingerprint the freshly built binary
        id: fingerprint
        run: |
          BIN=$(find native/rive-desktop/build -name '${{ matrix.library }}' | head -1)
          echo "Built: $BIN"
          test -n "$BIN"
          shasum -a 256 "$BIN" | tee built.sha256
          echo "path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Show what the binary needs from the system
        run: |
          case "${{ matrix.os }}" in
            macos) otool -L "${{ steps.fingerprint.outputs.path }}" ;;
            linux)
              objdump -p "${{ steps.fingerprint.outputs.path }}" | grep NEEDED
              echo "--- newest glibc symbol version referenced ---"
              objdump -T "${{ steps.fingerprint.outputs.path }}" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1
              ;;
            windows) llvm-objdump -p "${{ steps.fingerprint.outputs.path }}" | grep "DLL Name" ;;
          esac

      - name: Run the JVM tests against the freshly built binary
        if: matrix.tested
        run: |
          mkdir -p "$(dirname "$COMMITTED_LIBRARY")"
          cp "${{ steps.fingerprint.outputs.path }}" "$COMMITTED_LIBRARY"
          ./gradlew :library:jvmTest --rerun-tasks

      - name: Compare against the committed binary
        if: ${{ !inputs.upload_only }}
        run: |
          # A mismatch here means the pinned commit or the bridge changed without the
          # binary and its checksum in native/rive-desktop/README.md being updated.
          COMMITTED=$(git show "HEAD:$COMMITTED_LIBRARY" | shasum -a 256 | cut -d' ' -f1)
          BUILT=$(cut -d' ' -f1 < built.sha256)
          echo "committed: $COMMITTED"
          echo "built:     $BUILT"
          if [ "$COMMITTED" != "$BUILT" ]; then
            echo "::warning::Built ${{ matrix.library }} differs from the committed one. Replace the committed binary with this artifact and update its checksum in native/rive-desktop/README.md."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rive-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ steps.fingerprint.outputs.path }}
            built.sha256
            pinned-rive-runtime.txt
          if-no-files-found: error

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            library/build/reports/tests/jvmTest
            library/build/test-results/jvmTest
            library/hs_err_pid*.log
          if-no-files-found: ignore

  test-windows-arm64:
    name: test windows-arm64
    needs: build
    # Whatever happened to the other platforms' builds
    if: ${{ !cancelled() }}
    runs-on: windows-11-arm
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: rive-desktop-windows-arm64
          path: built

      - name: Run the JVM tests against the freshly built binary
        run: |
          BIN=$(find built -name 'librive-desktoparm64.dll' | head -1)
          mkdir -p runtime-windows-arm64/src/main/resources
          cp "$BIN" runtime-windows-arm64/src/main/resources/
          ./gradlew :library:jvmTest --rerun-tasks

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows-arm64
          path: |
            library/build/reports/tests/jvmTest
            library/build/test-results/jvmTest
            library/hs_err_pid*.log
          if-no-files-found: ignore
